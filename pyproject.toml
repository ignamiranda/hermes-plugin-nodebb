[project]
name = "hermes-plugin-nodebb"
version = "0.1.0"
description = "NodeBB platform plugin for Hermes Agent: adds a NodeBB forum as a messaging channel"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ignamiranda" }]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  # nodebb_socket.py drives a python-socketio AsyncClient; the asyncio_client
  # extra carries the asyncio transport support it needs.
  "python-socketio[asyncio_client]>=5.11,<6",
]

[project.urls]
Homepage = "https://github.com/ignamiranda/hermes-plugin-nodebb"
